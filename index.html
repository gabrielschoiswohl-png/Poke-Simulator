<!DOCTYPE html> 
<html lang="de"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Poke-Sim">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <title>PKMN Tracker - Battle Edition</title> 
    <style> 
        :root { 
            --accent: #2a75bb; 
            --bg: #1a1a1a; 
            --card: #2d2d2d; 
            --win: #f1c40f; 
            --danger: #e74c3c; 
            --success: #27ae60; 
            --active: #3498db; 
        } 
    
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 10px; padding-bottom: 140px; } 
          /* Das Grund-Grid: Standardmäßig einspaltig (für iPhone) */
.grid { 
    display: grid; 
    grid-template-columns: 1fr; 
    gap: 15px; 
    justify-items: center; 
    padding: 10px;
    width: 100%;
}

/* iPad-Ansicht: Hier erzwingen wir 2 Spalten */
@media (min-width: 768px) {
    .grid { 
        grid-template-columns: repeat(2, 1fr); /* Genau 2 Spalten */
        max-width: 1200px; /* Verhindert, dass es auf riesigen Bildschirmen zu breit wird */
        margin: 0 auto;
    }
}

/* Die Spieler-Karte soll im Grid immer voll ausgefüllt sein */
.player-col { 
    background: #2d2d2d; 
    border: 1px solid #444; 
    border-radius: 12px; 
    padding: 10px; 
    width: 100%; /* Wichtig: Füllt die Grid-Zelle aus */
    max-width: 450px; /* Damit es auf dem iPad nicht zu gestreckt aussieht */
    box-sizing: border-box;
}
        .team-ctrl { display: flex; gap: 8px; margin-top: 12px; } 
        .btn-add-pkmn, .btn-team-heal { flex: 1; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; color: white; }

        .btn-team-heal { background: #27ae60; }

        .win-fill { height: 100%; background: var(--win); width: 0%; transition: width 0.3s; }

        .card-sprite { position: relative; width: 96px; height: 96px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); border-radius: 10px; }

        /* Entwicklung */
        #evoOverlay { position: fixed; inset: 0; z-index: 9500; background: radial-gradient(circle at 50% 40%, #2b2b3a, #07070a 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 20px; transition: background 0.4s; }

        #evoOverlay.flash::after { content: ""; position: fixed; inset: 0; background: white; animation: evoFlash 0.8s ease-out forwards; pointer-events: none; }

        #diceModal .dice-grid .dice-btn { font-size: 22px; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; }

        #diceModal .dice-good { border-color: rgba(46,204,113,0.6); }
        #diceModal .dice-good small { color: #5ee08f; }
        #turnIndicator { text-align: center; color: var(--win); font-weight: bold; margin-bottom: 5px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
      /* --- AB HIER NEUE EVOLUTIONS-ANIMATION --- */
        @keyframes evoBlink {
            0% { opacity: 1; transform: scale(1); filter: brightness(1); }
            25% { opacity: 0; transform: scale(1.15); }
            50% { opacity: 1; transform: scale(1.3); filter: brightness(2.5); }
            75% { opacity: 0; transform: scale(1.15); }
            100% { opacity: 1; transform: scale(1); filter: brightness(1); }
        }
        .evolving-pokemon {
            animation: evoBlink 3.5s ease-in-out;
        }
        /* ==========================================
           🎨 TREFFER-MELDUNG GESTALTEN
           Hier kannst du Schrift, Farben und Größe der
           Meldung nach einem Angriff (MISS / Schaden / CRIT) ändern.
           ========================================== */
        :root {
            --hit-font: 'Bangers', 'Impact', sans-serif;  /* Schriftart */
            --hit-size: 50px;            /* Schriftgröße der Hauptzeile */
            --hit-sub-size: 30px;        /* Schriftgröße der Zusatzzeile (z. B. "Sehr effektiv!") */
            --hit-outline: #000;         /* Umrandung der Schrift */
            --hit-color: #ffffff;        /* Farbe bei normalem Treffer */
            --crit-color: #f1c40f;       /* Farbe bei CRIT */
            --miss-color: #95a5a6;       /* Farbe bei MISS */
            --hit-duration: 1.6s;        /* Wie lange die Meldung sichtbar ist */
        }
        #hitPopup { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 7000; pointer-events: none; font-family: var(--hit-font); text-align: center; letter-spacing: 2px; }
        #hitPopup .hit-main { font-size: var(--hit-size); color: var(--hit-color); -webkit-text-stroke: 3px var(--hit-outline); paint-order: stroke fill; text-shadow: 0 6px 0 rgba(0,0,0,0.5); }
        #hitPopup .hit-sub { font-size: var(--hit-sub-size); color: white; -webkit-text-stroke: 2px var(--hit-outline); paint-order: stroke fill; margin-top: 8px; }
        #hitPopup.crit .hit-main { color: var(--crit-color); font-size: calc(var(--hit-size) * 1.2); }
        #hitPopup.miss .hit-main { color: var(--miss-color); }
        #hitPopup.show { display: flex; animation: hitPop var(--hit-duration) ease-out forwards; }
        #hitPopup.crit.show .hit-main { animation: hitShake 0.4s ease-in-out 2; }
        @keyframes hitPop {
            0% { transform: scale(0.2); opacity: 0; }
            15% { transform: scale(1.25); opacity: 1; }
            25% { transform: scale(1); }
            80% { opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
        @keyframes hitShake {
            0%, 100% { transform: translateX(0) rotate(0); }
            25% { transform: translateX(-8px) rotate(-3deg); }
            75% { transform: translateX(8px) rotate(3deg); }
        }
    </style>

    <span id="volPct">100%</span>
</div>

<script> 
    // Übersichtsmusik: 3 aneinandergereihte Teile (ca. je 25 Min.). Teil und Sekunde werden am Gerät gemerkt,
    // damit die Musik nach einem Kampf oder Neuladen dort weiterläuft, wo sie war.
    const overviewMusic = (() => {
        const PARTS = ['sounds/uebersicht-1.mp3', 'sounds/uebersicht-2.mp3', 'sounds/uebersicht-3.mp3'];
        const KEY = 'pokeSimulatorOverviewMusic';
        const a = new Audio();
        a.preload = 'auto';
        let part = 0, seekTo = 0;
        try {
            const s = JSON.parse(localStorage.getItem(KEY));
            if (s && s.part >= 0 && s.part < PARTS.length) { part = s.part; seekTo = s.time || 0; }
        } catch (e) {}
        const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ part, time: a.currentTime || seekTo })); } catch (e) {} };
        const load = i => { part = i; a.src = PARTS[i]; };
        load(part);
        a.addEventListener('loadedmetadata', () => {
            if (seekTo > 0 && seekTo < a.duration) { try { a.currentTime = seekTo; } catch (e) {} }
            seekTo = 0;
        });
        a.addEventListener('ended', () => { seekTo = 0; load((part + 1) % PARTS.length); a.play().catch(() => {}); save(); });
        setInterval(() => { if (!a.paused) save(); }, 2000);
        document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
        window.addEventListener('pagehide', save);
        return {
            audio: a,
            play() { applyGain(a); return a.play(); },
            set volume(v) { a.volume = v; },
            get volume() { return a.volume; },
            pause() { a.pause(); save(); },
            set currentTime(v) { /* bewusst ignoriert: die Übersichtsmusik läuft immer weiter */ },
            get currentTime() { return a.currentTime; }
        };
    })();
    const audioTracks = {
    arena: overviewMusic, // Übersichtsbildschirm
    choose: new Audio('sounds/pokemon-wahl.mp3'), // Trainer-Duell: von der Auswahl bis zum Kampfbeginn
    battle: null, // wird bei jedem Trainer-Duell zufällig gewählt, siehe playBattleMusic()
    victory: new Audio('sounds/sieg.mp3')
};

// Musik-Schleifen im Hintergrund aktivieren
audioTracks.choose.loop = true;

// Kampfmusik fürs Trainer-Duell: bei jedem Kampf zufällig eines dieser Lieder (Ordner sounds/kampf)
const battleSongs = ['champ.mp3', 'lets-go.mp3', 'kolosseum-runde1.mp3', 'kolosseum-finale.mp3', 'top-vier.mp3', 'arenaleiter.mp3'];
// Musik für Kämpfe gegen wilde Pokémon (Ordner sounds/wild)
const wildSongs = [/* 'gold-silber.mp3', */ 'heartgold.mp3', 'smaragd.mp3', /* 'feuerrot.mp3', */ /* 'rot-blau.mp3', */ 'wild-pokemon.mp3', 'normaler-kampf.mp3'];
function playBattleMusic(wild = false) {
    const list = wild ? wildSongs : battleSongs;
    const song = list[Math.floor(Math.random() * list.length)];
    audioTracks.battle = new Audio('sounds/' + (wild ? 'wild/' : 'kampf/') + song);
    audioTracks.battle.loop = true;
    playMusic('battle');
}
let currentTrack = null;

// ==========================================
// 🔊 SOUNDS (Ton an/aus wird am Gerät gemerkt)
// ==========================================
let soundOn = true;
try { soundOn = localStorage.getItem('pokeSimulatorSound') !== 'off'; } catch (e) {}

// Gesamtlautstärke (0–1), wird am Gerät gemerkt
let masterVol = 1;
try { const v = parseFloat(localStorage.getItem('pokeSimulatorVolume')); if (v >= 0 && v <= 1) masterVol = v; } catch (e) {}

// Safari auf iPad/iPhone ignoriert audio.volume. Dort läuft der Ton deshalb über einen Web-Audio-Regler.
const volumeReadOnly = (() => { const t = new Audio(); t.volume = 0.5; return t.volume !== 0.5; })();
let audioCtx = null, masterGain = null;
function applyGain(track) {
    if (!volumeReadOnly) return;
    const a = track.audio || track;
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!audioCtx) {
            audioCtx = new AC();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = masterVol;
            masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
        if (!a._gainSource) { a._gainSource = audioCtx.createMediaElementSource(a); a._gainSource.connect(masterGain); }
    } catch (e) {}
}
['touchstart', 'click'].forEach(ev => document.addEventListener(ev, () => { if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {}); }, true));
// Lautstärke eines Sounds: auf dem iPad regelt der Web-Audio-Regler, sonst audio.volume
function vol(base = 1) { return volumeReadOnly ? base : base * masterVol; }

function updateSoundButtons() {
    const muted = !soundOn || masterVol === 0;
    document.querySelectorAll('.sound-toggle').forEach(b => b.innerText = muted ? '🔇' : '🔊');
    const m = document.getElementById('volMute'); if (m) { m.innerText = muted ? '🔇' : '🔊'; m.classList.toggle('muted', !soundOn); }
    const sl = document.getElementById('volSlider'); if (sl) sl.value = Math.round(masterVol * 100);
    const pc = document.getElementById('volPct'); if (pc) pc.innerText = Math.round(masterVol * 100) + '%';
}

function toggleSound() {
    soundOn = !soundOn;
    try { localStorage.setItem('pokeSimulatorSound', soundOn ? 'on' : 'off'); } catch (e) {}
    if (!soundOn && currentTrack) currentTrack.pause();
    if (soundOn && currentTrack) { currentTrack.volume = vol(1); applyGain(currentTrack); currentTrack.play().catch(() => {}); }
    updateSoundButtons();
}

function onVolumeInput(v) {
    masterVol = Math.max(0, Math.min(1, v / 100));
    try { localStorage.setItem('pokeSimulatorVolume', masterVol); } catch (e) {}
    if (masterGain) masterGain.gain.value = masterVol;
    if (currentTrack) currentTrack.volume = vol(1);
    if (masterVol > 0 && !soundOn) toggleSound(); else updateSoundButtons();
}

// Regler-Fenster direkt unter dem angetippten Sound-Symbol
function openVolumePanel(ev) {
    const panel = document.getElementById('volumePanel');
    if (panel.style.display === 'flex') { panel.style.display = 'none'; return; }
    updateSoundButtons();
    panel.style.display = 'flex';
    const r = ev.currentTarget.getBoundingClientRect();
    panel.style.top = (r.bottom + 8) + 'px';
    panel.style.left = Math.max(8, Math.min(window.innerWidth - panel.offsetWidth - 8, r.right - panel.offsetWidth)) + 'px';
}
document.addEventListener('click', e => {
    const panel = document.getElementById('volumePanel');
    if (panel && panel.style.display === 'flex' && !panel.contains(e.target) && !e.target.closest('.sound-toggle')) panel.style.display = 'none';
});

// Spielt einen Sound aus dem Ordner "sounds" ab (z. B. playSound('cries/25.mp3'))
function playSound(file, volume = 1) {
    if (!soundOn) return;
    const a = new Audio('sounds/' + file);
    a.volume = vol(volume);
    applyGain(a);
    a.play().catch(() => {});
}

// Pokémon-Ruf: die Nummer steckt im Sprite-Link (…/25.png)
function playCry(card) {
    if (!card) return;
    const m = card.querySelector('.pkmn-icon-small').src.match(/\/0*(\d+)\.png$/);
    if (m) playSound('cries/' + m[1] + '.mp3', 0.6);
}

function playMusic(trackName) {
    if (currentTrack === audioTracks[trackName]) return;
    if (currentTrack) {
        currentTrack.pause();
        currentTrack.currentTime = 0;
    }
    currentTrack = audioTracks[trackName];
    if (currentTrack) currentTrack.volume = vol(1);
    if (currentTrack && soundOn) {
        applyGain(currentTrack);
        currentTrack.play().catch(err => console.log("iPad wartet auf Berührung des Bildschirms..."));
    }
}

// iPad & Mobile Schutz: Aktiviert die Musik beim allerersten Tippen auf das Display
document.addEventListener('touchstart', () => {
    playMusic('arena');
}, { once: true });

// Fallback für den PC (Mausklick)
document.addEventListener('click', () => {
    playMusic('arena');
}, { once: true });

    function showHitPopup(mainText, subText, kind) {
        const popup = document.getElementById('hitPopup');
        popup.querySelector('.hit-main').innerText = mainText;
        popup.querySelector('.hit-sub').innerText = subText || "";
        popup.className = kind || "";
        void popup.offsetWidth; // Animation neu starten
        popup.classList.add('show');
        clearTimeout(popup.hideTimer);
        const duration = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hit-duration')) || 1.6;
        popup.hideTimer = setTimeout(() => { popup.className = ""; }, duration * 1000);
    }

    function showToast(msg) {
        const toast = document.getElementById('battleToast'); toast.innerText = msg; toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function createPlayer() { 
        const id = "p" + Date.now() + Math.random().toString(36).substr(2, 5); 
        const col = document.createElement('div'); col.className = 'player-col'; col.id = id; 
        col.innerHTML = ` 
            <button class="del-btn" onclick="removePlayer('${id}')">&times;</button> 
            <input type="text" value="SPIELER ${players.length+1}" style="background:none; border:none; color:var(--win); font-weight:bold; width:80%; font-size:18px; outline:none; margin-bottom:12px;"> 
            <div class="pkmn-list"></div> 
            <div class="team-ctrl"> 
                <button class="btn-add-pkmn" onclick="addPkmn('${id}')">+ PKMN</button> 
                <button class="btn-team-heal" onclick="healTeam('${id}')">TEAM HEILEN</button> 
            </div>`; 
        document.getElementById('board').appendChild(col); players.push({id: id}); addPkmn(id); 
    } 

    // Hält KP-Balken, Erfahrungsbalken und "besiegt"-Anzeige der Karten aktuell
    function refreshCardBars() {
        document.querySelectorAll('#board .pkmn-card').forEach(card => {
            const hpBox = card.querySelector('.hp-box');
            const fill = card.querySelector('.card-hp-fill');
            if (!hpBox || !fill) return;
            const hp = parseInt(hpBox.innerText) || 0;
            const maxHp = parseInt(card.dataset.maxhp) || 1;
            const percent = Math.max(0, Math.min(100, hp / maxHp * 100));
            fill.style.width = percent + "%";
            fill.style.backgroundColor = percent < 20 ? "var(--danger)" : percent < 50 ? "#f1c40f" : "#2ecc71";
            const maxText = "/ " + maxHp;
            const maxEl = card.querySelector('.card-hp-max');
            if (maxEl.textContent !== maxText) maxEl.textContent = maxText;
            card.classList.toggle('fainted', hp <= 0);
            const wins = parseInt(card.dataset.wins) || 0;
            const needed = getWinsNeeded(card.querySelector('input').value, parseInt(card.dataset.stage) || 1) || 2;
            const winsText = wins + "/" + needed;
            const winsEl = card.querySelector('.card-wins-text');
            if (winsEl.textContent !== winsText) winsEl.textContent = winsText;
            card.querySelector('.win-fill').style.width = Math.min(100, wins / needed * 100) + "%";
            const stageText = "S" + (card.dataset.stage || 1);
            const stageEl = card.querySelector('.stage-tag');
            if (stageEl.textContent !== stageText) stageEl.textContent = stageText;
        });
    }

    function addPkmn(pid) { 
        const container = document.getElementById(pid).querySelector('.pkmn-list'); const card = document.createElement('div'); 
        card.className = 'pkmn-card'; card.dataset.stage = "1"; card.dataset.wins = "0"; card.dataset.kat = "1"; card.dataset.maxhp = "140"; card.dataset.poisoned = "false";
        card.innerHTML = `<button class="del-btn" onclick="this.parentElement.remove()">&times;</button><div class="card-top"><div class="card-sprite"><img class="pkmn-icon-small" src="${pkBallSprite}"></div><div class="card-info"><div class="card-name-row"><span class="stage-tag">S1</span><div style="position:relative; flex-grow:1; min-width:0;"><input type="text" placeholder="Name..." oninput="showSearch(this)" class="card-name"><div class="search-results"></div></div></div><div class="card-bar-row"><span class="card-bar-label">KP</span><div class="card-hp-track"><div class="card-hp-fill"></div></div></div><div class="card-hp-text"><div class="hp-box">140</div><span class="card-hp-max">/ 140</span></div><div class="card-bar-row"><span class="card-bar-label">EP</span><div class="win-track"><div class="win-fill"></div></div><span class="card-wins-text">0/2</span></div></div></div><div class="btn-grid"><button class="btn-action potion" onclick="applyHeal(this, 120)"><img src="${imgTrank}">120</button><button class="btn-action super" onclick="applyHeal(this, 200)"><img src="${imgSuper}">200</button><button class="btn-action hyper" onclick="applyHeal(this, 9999)"><img src="${imgHyper}">MAX</button><button class="btn-action revive" onclick="applyRevive(this, 160)"><img src="${imgBeleber}">160</button><button class="btn-action max-revive" onclick="applyRevive(this, 9999)"><img src="${imgTopBeleber}">MAX</button></div>`;

    function applyHeal(btn, amount) {
        const card = btn.closest('.pkmn-card');
        const hpBox = card.querySelector('.hp-box');
        const maxHp = parseInt(card.dataset.maxhp);
        let hp = parseInt(hpBox.innerText);
        if(hp <= 0) return showToast("Pokémon ist besiegt!");
        hpBox.innerText = Math.min(maxHp, hp + amount);
        if(activeP1 || activeP2) updateArena();
    }

    function applyRevive(btn, amount) {
        const card = btn.closest('.pkmn-card');
        const hpBox = card.querySelector('.hp-box');
        const maxHp = parseInt(card.dataset.maxhp);
        if(parseInt(hpBox.innerText) > 0) return showToast("Pokémon ist noch fit!");

function renderSlot(side, pkmn, isAttacker) {
    const slot = document.getElementById(`slotP${side}`); 
    const currentHp = parseInt(pkmn.querySelector('.hp-box').innerText); 
    const maxHp = parseInt(pkmn.dataset.maxhp); 
    const name = pkmn.querySelector('input').value || "PKMN"; 
    const stage = pkmn.dataset.stage; 
    const percent = Math.max(0, (currentHp / maxHp) * 100);
    
    let hpColor = "var(--success)"; 
    if(percent < 50) hpColor = "#f1c40f"; 
    if(percent < 20) hpColor = "#f1c40f"; // Ggf. anpassen
    if(percent < 20) hpColor = "var(--danger)";
    
    const isPoisoned = pkmn.dataset.poisoned === "true";
    const waitingClass = !isAttacker ? "is-waiting" : "";

    slot.className = `fighter-slot ${isAttacker ? 'is-attacker' : 'is-target'} ${isPoisoned ? 'poisoned' : ''} ${waitingClass}`; 
    const wins = parseInt(pkmn.dataset.wins) || 0;
    const winsNeeded = getWinsNeeded(name, parseInt(stage) || 1) || 2;
    const winPercent = Math.min(100, wins / winsNeeded * 100);
    let content = `<div class="fs-top">
        <div class="fs-sprite"><img src="${pkmn.querySelector('.pkmn-icon-small').src}"></div>
        <div class="fs-info">
            <div class="fs-name-row"><span class="stage-tag">S${stage}</span><b class="fs-name">${name}</b>${isPoisoned ? '<span class="poison-tag">GIFT</span>' : ''}</div>
            <div class="fs-bar-row"><span class="fs-label">KP</span><div class="hp-bar-container"><div class="hp-bar-fill" style="width: ${percent}%; background-color: ${hpColor};"></div></div></div>
            <div class="fs-hp-text"><b>${currentHp}</b> / ${maxHp}</div>
            <div class="fs-bar-row"><span class="fs-label">EP</span><div class="fs-ep-track"><div class="fs-ep-fill" style="width:${winPercent}%;"></div></div><span class="fs-ep-text">${wins}/${winsNeeded}</span></div>
        </div>
    </div>`; 
    
    // Spieler 1 greift zuerst an: ist sein Pokémon zu Rundenbeginn besiegt (z. B. durch Gift), muss er wechseln
    if(currentHp <= 0 && (attackerSide !== side || side === 1)) {
        content += `<div class="death-overlay">X</div>`; 
        setTimeout(() => openSwitchMenu(side, true), 1000); 
    } 
    else if(isAttacker) { 
        let atks = `<div class="atk-grid">`; 
        
        // Prüfen ob Ditto transformiert ist
        const isTransformed = pkmn.dataset.isTransformed === "true";
        const atkSource = isTransformed ? JSON.parse(pkmn.dataset.transformedAtks) : (pokemonDB[name] ? pokemonDB[name].atks : []);

        if (atkSource) {
            // Gleiche Attacke mehrmals (z. B. stärkeres Donnerblitz ab S3): nur die höchste freigeschaltete Version zeigen, am Platz der alten
            const unlocked = atkSource.filter(a => a.s <= stage);
            const best = {};
            unlocked.forEach(a => { if (!best[a.n] || a.s >= best[a.n].s) best[a.n] = a; });
            const shownAtks = [];
            unlocked.forEach(a => { if (!shownAtks.includes(best[a.n])) shownAtks.push(best[a.n]); });
            shownAtks.forEach(a => {
                // NEU: Wandler nutzt triggerAtk, damit das Würfel-Menü erscheint
                if (a.n === "Wandler") {
                    atks += `<button class="atk-btn" onclick="triggerAtk(0, 'Normal', event, 1, 'Wandler')">Wandler</button>`;
                } else {
                    atks += `<button class="atk-btn" style="--type:${typeColors[a.t] || '#888'}" onclick="triggerAtk(${a.d}, '${a.t}', event, ${a.m || 1}, '${a.n}')"><span class="atk-type">${a.t}</span><span class="atk-name">${a.n}</span><b class="atk-dmg">${a.d}</b></button>`;
                }
            });
        }
        
        content += atks + `</div>
            <div class="fs-actions">
                <button class="btn-switch-arena" onclick="openSwitchMenu(${side}, false)"><img src="${pkBallSprite}">Wechseln</button>
                <button class="btn-item-arena" onclick="openItemMenu(${side})"><img src="${imgTrank}">Items</button>
            </div>`; 
    } 
    slot.innerHTML = content; 
}
    function openSwitchMenu(side, isForced) {

    function applyBattleItem(side, type, amount) {
        const pkmn = (side === 1 ? activeP1 : activeP2);
        const hpBox = pkmn.querySelector('.hp-box');
        const maxHp = parseInt(pkmn.dataset.maxhp);
        let currentHp = parseInt(hpBox.innerText);

        if(type === 'heal') {
            if(currentHp <= 0) return showToast("PKMN braucht Beleber!");
            hpBox.innerText = Math.min(maxHp, currentHp + amount);
            showToast("Geheilt!");
        } else if(type === 'revive') {
            if(currentHp > 0) return showToast("PKMN ist nicht besiegt!");
            hpBox.innerText = Math.min(maxHp, amount);
            pkmn.dataset.poisoned = "false";
            pkmn.removeAttribute('data-poison-fresh');
            showToast("Wiederbelebt!");
        } else if(type === 'antidote') {
            // HINZUGEFÜGT: Logik für das Gegengift
            if(currentHp <= 0) return showToast("Pokémon ist bereits besiegt!");
            if(pkmn.dataset.poisoned !== "true") return showToast("Pokémon ist nicht vergiftet!");
            
            // Vergiftung aufheben und alle dazugehörigen Datensätze löschen
            pkmn.dataset.poisoned = "false";
            pkmn.removeAttribute('data-poison-dmg');
            pkmn.removeAttribute('data-poison-source-id');
            pkmn.removeAttribute('data-poison-fresh');
            showToast(pkmn.querySelector('input').value + " wurde vom Gift geheilt!");
        }
        
        document.getElementById('itemMenu').style.display = 'none'; 
        updateArena();
    }

    function triggerAtk(dmg, type, e, maxHits = 1, name = "") {

    }
function dittoTransform(side) {
    const attacker = (side === '1' ? activeP1 : activeP2);
    const target = (side === '1' ? activeP2 : activeP1);
    
    // Kopiere alle Attacken des Ziels auf Ditto
    const targetName = target.querySelector('input').value;
    const targetData = pokemonDB[targetName];
    
    if (targetData) {
        // Wir speichern die kopierten Attacken direkt in einer Eigenschaft des Cards
        attacker.dataset.transformedAtks = JSON.stringify(targetData.atks);
        attacker.dataset.isTransformed = "true";
        
        showToast("Ditto hat sich in " + targetName + " verwandelt!");
        updateArena();
    }
}
    function processHit(type) {

function getWinsNeeded(pokemonName, stage) {
    const current = pokemonDB[pokemonName];

    // Manueller Sonderwert hat Vorrang: levelWins: [S1→S2, S2→S3, Entwicklung] im Pokémon-Eintrag
    if (current?.levelWins) {
        return current.levelWins[stage - 1];
    }

    // Kategorie-Sprung zur Entwicklung (bei mehreren Entwicklungen zählt die höchste Kategorie)
    const ownKat = current?.kat || 1;
    const next = evolutions[pokemonName];
    const nextNames = next ? (Array.isArray(next) ? next : [next]) : [];
    const nextKats = nextNames.map(name => pokemonDB[name]?.kat).filter(kat => kat != null);
    const categoryJump = nextKats.length ? Math.max(...nextKats) - ownKat : 0;

    // Siege [S1→S2, S2→S3, Entwicklung nach S3]
    let wins;
    if (categoryJump >= 2) wins = [1, 2, 4];      // überspringt eine Kategorie, z. B. Evoli, Karpador: 7 Siege
    else if (ownKat === 1) wins = [1, 1, 2];      // Kat 1 → 2: 4 Siege
    else if (ownKat === 2) wins = [1, 2, 2];      // Kat 2 → 3: 5 Siege
    else if (nextKats.length) wins = [2, 2, 2];   // Kat 3/4 mit Entwicklung (Rihorn, Onix): 6 Siege
    else wins = [2, 3, 2];                        // Kat 3 und 4 ohne Entwicklung: 2 + 3 Siege bis S3

    return wins[stage - 1] ?? 2;
}

let evoBusy = false;          // läuft gerade eine Entwicklung (oder Auswahl)?
let afterEvolution = [];      // was danach passieren soll (z. B. Sieger-Anzeige)
let lastLevelUpAt = 0;        // wann zuletzt der Level-up-Sound kam

function whenEvolutionDone(fn) {
    if (evoBusy) afterEvolution.push(fn); else fn();
}

function finishEvolution() {
    evoBusy = false;
    const todo = afterEvolution; afterEvolution = [];
    todo.forEach(fn => fn());

// Hilfsfunktion: Führt die eigentliche Entwicklung aus und zeigt die Animation
function performEvolution(nextName, pkmn) {
    const oldName = pkmn.querySelector('input').value;
    const oldIcon = pkmn.querySelector('.pkmn-icon-small').src;
    const nd = pokemonDB[nextName];
    pkmn.querySelector('input').value = nextName;
    pkmn.querySelector('.pkmn-icon-small').src = nd.icon;
    pkmn.dataset.kat = nd.kat;
    pkmn.dataset.stage = "1";
    pkmn.dataset.wins = "0";
    pkmn.dataset.maxhp = nd.hp[0];
    pkmn.querySelector('.hp-box').innerText = nd.hp[0];
    pkmn.querySelector('.stage-tag').innerText = "S1";
    pkmn.querySelector('.win-fill').style.width = "0%";
    showEvolutionAnimation(oldName, oldIcon, nextName, nd.icon, pkmn);
}

function showEvolutionAnimation(oldName, oldIcon, newName, newIcon, pkmn) {
    evoBusy = true;
    const music = currentTrack;
    if (music) music.pause();

    const overlay = document.createElement('div');
    overlay.id = 'evoOverlay';
    overlay.innerHTML = `<div class="evo-stage"><div class="evo-glow"></div><img class="evo-sprite" src="${oldIcon}"></div>
        <div class="evo-text">Nanu? <b>${oldName}</b> entwickelt sich!</div>
        <button class="setup-next evo-btn" style="visibility:hidden;">Weiter</button>`;
    document.body.appendChild(overlay);
    const img = overlay.querySelector('.evo-sprite');
    const text = overlay.querySelector('.evo-text');
    const btn = overlay.querySelector('.evo-btn');
    playCry({ querySelector: () => ({ src: oldIcon }) });

    // Entwicklungsmusik nur während der Animation
    const evoMusic = new Audio('sounds/entwicklung.mp3');
    evoMusic.volume = vol(0.8);
    if (soundOn) { applyGain(evoMusic); evoMusic.play().catch(() => {}); }

    // Phase 1: kurz das alte Pokémon zeigen, dann ca. 16 Sekunden lang zwischen alt und neu wechseln
    // (als weiße Silhouette), erst langsam, dann immer schneller
    const FLICKER_MS = 11000;
    setTimeout(() => {
        img.classList.add('silhouette');
        overlay.classList.add('evolving');
        const start = Date.now();
        let showNew = false;
        const flip = () => {
            const progress = (Date.now() - start) / FLICKER_MS;
            if (progress >= 1) return reveal();
            showNew = !showNew;
            img.src = showNew ? newIcon : oldIcon;
            setTimeout(flip, 1100 * Math.pow(1 - progress, 2) + 50);
        };
        setTimeout(flip, 1100);
    }, 2500);

    // Phase 2: weißer Blitz, das neue Pokémon erscheint
    function reveal() {
        overlay.classList.add('flash');
        // Entwicklungsmusik kurz ausblenden
        const fade = setInterval(() => {
            evoMusic.volume = Math.max(0, evoMusic.volume - 0.1);
            if (evoMusic.volume <= 0) { evoMusic.pause(); clearInterval(fade); }
        }, 40);
        setTimeout(() => {
            img.src = newIcon;
            img.classList.remove('silhouette');
            img.classList.add('evo-pop');
            overlay.classList.remove('evolving');
            text.innerHTML = `Glückwunsch! <b>${oldName}</b> hat sich zu <b>${newName}</b> entwickelt!`;
            playSound('level-up.mp3');
            lastLevelUpAt = Date.now();
            setTimeout(() => playCry(pkmn), 300);
            btn.style.visibility = 'visible';
        }, 350);
    }

    btn.onclick = () => {
        overlay.remove();
        if (music && music === currentTrack && soundOn) music.play().catch(() => {});
        if (activeP1 || activeP2) updateArena();
        finishEvolution();
    };
}

  function resetGame() {
        if (!confirm("Wirklich zurücksetzen? Alle Spieler und Pokémon werden gelöscht. Deinen mit 💾 gespeicherten Stand kannst du über 📂 Laden zurückholen.")) return;
        document.getElementById('board').innerHTML = "";
        players = [];
        for(let i=0; i<4; i++) createPlayer();
  }

  function closeSaveOverlay() {
        const o = document.getElementById('saveOverlay');
        if (o) o.remove();
  }

  function showSaveOverlay(html) {
        closeSaveOverlay();
        const overlay = document.createElement('div');
        overlay.id = 'saveOverlay';
        overlay.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px; box-sizing:border-box;";
        overlay.innerHTML = `<div style="background:#2d2d2d; padding:20px; border-radius:15px; width:100%; max-width:400px; text-align:center; border:2px solid #27ae60;">${html}
            <button onclick="closeSaveOverlay()" style="margin-top:15px; width:100%; padding:12px; background:#444; border:none; color:white; border-radius:8px;">Schließen</button></div>`;
        document.body.appendChild(overlay);
  }

  function getSavedGame() {
        try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; }
  }

  // Automatisch mitspeichern, damit beim Neuladen nichts verloren geht
  const AUTO_KEY = "pokeSimulatorAutosave";
  let lastAutoJson = "";
  function autoSave() {
        const json = JSON.stringify(getGameState());
        if (json === lastAutoJson) return;
        try { localStorage.setItem(AUTO_KEY, json); lastAutoJson = json; } catch (e) {}
  }

  // 💾 Speichern: Sicherungspunkt, zu dem du über 📂 Laden zurückkehren kannst
  function saveBattleState() {
        const gameState = getGameState();
        gameState.savedAt = new Date().toLocaleString('de-AT');
        let ok = true;
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(gameState)); } catch (e) { ok = false; }
        autoSave();
        const badge = document.getElementById('saveBadge');
        badge.innerHTML = '<span class="save-spinner"></span> Speichern...';
        badge.className = 'show';
        clearTimeout(badge.hideTimer);
        badge.hideTimer = setTimeout(() => {
            badge.innerHTML = ok ? '✅ Gespeichert' : '⚠️ Speichern nicht möglich';
            badge.hideTimer = setTimeout(() => { badge.className = ''; }, 1200);
        }, 700);
  }

  function showExportCode() {
        const exportCode = btoa(unescape(encodeURIComponent(JSON.stringify(getGameState()))));
        showSaveOverlay(`
            <h3 style="color:#27ae60;">Code für ein anderes Gerät</h3>
            <textarea style="width:100%; height:100px; background:#111; color:#27ae60; border:none; padding:10px; box-sizing:border-box;">${exportCode}</textarea>`);
  }

  // 📂 Laden: gespeicherten Stand vom iPad oder einen Code laden
  function loadBattleState() {
        const saved = getSavedGame();
        const savedButton = (saved && saved.players)
            ? `<button onclick="loadSavedGame()" style="width:100%; padding:15px; background:#27ae60; border:none; color:white; border-radius:8px; font-weight:bold;">Gespeicherten Stand laden<br><small>${saved.savedAt || ""}</small></button>`
            : `<p style="font-size:14px;">Noch kein Spielstand gespeichert.</p>`;
        showSaveOverlay(`
            <h3 style="color:#2980b9;">📂 Laden</h3>
            ${savedButton}
            <button onclick="loadFromCode()" style="margin-top:10px; width:100%; padding:12px; background:#2980b9; border:none; color:white; border-radius:8px;">Code einfügen</button>
            <button onclick="showExportCode()" style="margin-top:10px; width:100%; padding:12px; background:#555; border:none; color:white; border-radius:8px;">Code für anderes Gerät anzeigen</button>`);
  }

  function loadSavedGame() {
        const saved = getSavedGame();
        closeSaveOverlay();
        if (!saved) return;
        applyGameState(saved);
        showToast("Spielstand geladen!");
  }

  function loadFromCode() {
        closeSaveOverlay();
        const importCode = prompt("Füge hier deinen Spielstand-Code ein:");
        if (!importCode) return;
        let gameState;
        try {
            const raw = atob(importCode.trim());
            try { gameState = JSON.parse(decodeURIComponent(escape(raw))); } catch (e) { gameState = JSON.parse(raw); }
        } catch (e) {
            return alert("Fehler beim Laden: Der Code ist ungültig.");
        }
        applyGameState(gameState);
        showToast("Spielstand geladen!");
  }

    window.onload = () => { 
        updateSoundButtons();
        // Beim Öffnen: zuerst den automatisch gesicherten Stand, sonst den mit 💾 gespeicherten
        let auto = null;
        try { auto = JSON.parse(localStorage.getItem(AUTO_KEY)); } catch (e) {}
        const saved = (auto && auto.players && auto.players.length) ? auto : getSavedGame();
        if (saved && saved.players && saved.players.length) {
            applyGameState(saved);
        } else {
            for(let i=0; i<4; i++) createPlayer(); 
        }
        refreshCardBars();
        new MutationObserver(refreshCardBars).observe(document.getElementById('board'), { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['data-maxhp', 'data-wins', 'data-stage'] });
        document.getElementById('board').addEventListener('input', refreshCardBars);
        lastAutoJson = JSON.stringify(getGameState());
        setInterval(autoSave, 2000);
        document.addEventListener('visibilitychange', autoSave);
        window.addEventListener('pagehide', autoSave);
    };
</script> 
</body> 
</html>
